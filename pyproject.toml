[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "reachlens"
version = "0.1.0"
description = "Reachability and IK-success maps for robot arms, in MuJoCo (no ROS needed)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["numpy", "mujoco>=3.0", "matplotlib", "pillow"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
reachlens = "reachlens.cli:main"

[tool.setuptools]
packages = ["reachlens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
